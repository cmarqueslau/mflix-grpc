syntax = "proto3";

package mflix;

import "google/protobuf/empty.proto";

option java_package = "mflix"; 
option java_multiple_files = true; 

option csharp_namespace = "Mflix";

option go_package = "mflix/internal/pb";

message Movie {
    string id = 1;
    string plot = 2;
    repeated string genres = 3;
    int32 runtime = 4;
    repeated string cast = 5;
    int32 num_mflix_comments = 6;
    string title = 7;
    string fullplot = 8;
    repeated string countries = 9;
    string released = 10;
    repeated string directors = 11;
    string rated = 12;
    string lastupdated = 13;
    int32 year = 14;
    string type = 15;
}

message CreateMovieRequest { Movie movie = 1; }
message GetMovieRequest { string id = 1; }
message UpdateMovieRequest { Movie movie = 1; }
message DeleteMovieRequest { string id = 1; }
message ListByActorRequest { string actor = 1; }
message ListByGenreRequest { string genre = 1; }

service MovieService {
    rpc CreateMovie (CreateMovieRequest) returns (Movie);
    rpc GetMovie (GetMovieRequest) returns (Movie);
    rpc UpdateMovie (UpdateMovieRequest) returns (Movie);
    rpc DeleteMovie (DeleteMovieRequest) returns (google.protobuf.Empty);
    rpc ListByActor (ListByActorRequest) returns (stream Movie);
    rpc ListByGenre (ListByGenreRequest) returns (stream Movie);
}
